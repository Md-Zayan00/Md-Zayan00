name: Generate Profile Badges & Pacman Grid

on:
  schedule:
    - cron: '0 0 * * *' # Refreshes daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # Step Needed for Puppeteer to run in Headless Ubuntu
      - name: Install Chrome dependencies
        run: sudo apt-get install -y libgbm-dev

      - name: Generate Blade Runner Badge
        run: node generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}

      - name: Generate Animated Pacman Matrix
        run: node generate-pacman-matrix.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}

      - name: Commit and Push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg pacman-grid-animated-dark.svg pacman-grid-animated-light.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh dynamic profile assets [skip ci]"
          git push