name: Generate Profile Badges & Pacman Matrix

on:
  schedule:
    - cron: '0 0 * * *' # Refreshes daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate Blade Runner Console Badge
        run: node generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}

      - name: Generate Animated Pacman Contribution Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            pacman-dark.svg?palette=github-dark&color_snake=#ff3b56&color_dots=#12080a,#421219,#7a1d2c,#b8283f,#ff3b56
            pacman-light.svg?palette=github-light&color_snake=#dc2626&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Commit and Push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg pacman-dark.svg pacman-light.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync console badge and pacman matrix [skip ci]"
          git push